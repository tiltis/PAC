<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콜드체인 포장 검사 스테이션</title>
<style>
  @font-face {
    font-family: "Pretendard"; font-weight: 45 920; font-style: normal; font-display: swap;
    src: url("/fonts/PretendardVariable.woff2") format("woff2-variations"), url("/fonts/PretendardVariable.woff2") format("woff2");
  }
  :root {
    --navy:#0b1d36; --navy-2:#13294b; --bg:#f2f4f7; --card:#ffffff; --ink:#0f1b2d; --ink-2:#334155; --mute:#6b7789;
    --line:#e2e7ee; --line-2:#eef1f5; --accent:#1f4fd8; --accent-soft:#e8eefc;
    --ok:#127a46; --ok-soft:#e5f4ec; --warn:#c42b2b; --warn-soft:#fcebeb; --amber:#8a6100; --amber-soft:#fbf2dc;
    --blue:#1f4fd8; --blue-soft:#e8eefc;
    --radius:12px; --shadow:0 1px 2px rgba(15,27,45,.04), 0 4px 16px rgba(15,27,45,.05);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  .face img:not([src]) { display:none; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         letter-spacing:-0.01em; font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased; }

  /* 상단 바 */
  .topbar { background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color:#fff; }
  .topbar-inner { max-width:1280px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo { width:38px; height:38px; border-radius:9px; background:#fff; color:var(--navy); display:grid; place-items:center;
          font-weight:800; font-size:13px; letter-spacing:.02em; flex:none; }
  .brand h1 { margin:0; font-size:18px; font-weight:700; letter-spacing:-0.02em; }
  .brand p { margin:1px 0 0; font-size:12.5px; color:#a9b8d0; font-weight:500; letter-spacing:.01em; }
  .top-status { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px; font-size:13px; font-weight:600;
          background:rgba(255,255,255,.08); color:#dfe7f5; border:1px solid rgba(255,255,255,.12); white-space:nowrap; }
  .chip i { width:7px; height:7px; border-radius:50%; background:#8ea0bd; display:inline-block; }

  main { max-width:1280px; margin:0 auto; padding:20px; display:grid; gap:16px;
         grid-template-columns:minmax(0, 420px) minmax(0, 1fr); align-items:start; }
  .col { display:grid; gap:16px; min-width:0; }
  .wide { grid-column:1 / -1; }
  @media (max-width:980px) { main { grid-template-columns:minmax(0,1fr); padding:14px; } .topbar-inner { padding:12px 14px; } }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line-2); }
  .card-head h2 { margin:0; font-size:15px; font-weight:700; letter-spacing:-0.01em; }
  .card-head .sub { font-size:12.5px; color:var(--mute); font-weight:500; }
  .card-body { padding:16px 18px; }

  label.field { display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin:0 0 6px; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .field-row.single { grid-template-columns:1fr; }
  input, select { width:100%; min-width:0; font:inherit; font-size:15px; padding:10px 12px; color:var(--ink);
                  border:1px solid var(--line); border-radius:9px; background:#fbfcfd; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:#fff; }
  button { font:inherit; font-weight:600; font-size:14.5px; padding:11px 16px; border:1px solid transparent; border-radius:9px; cursor:pointer;
           background:var(--accent); color:#fff; transition:filter .15s, background .15s; }
  button:hover:not(:disabled) { filter:brightness(1.06); }
  button:disabled { opacity:.38; cursor:not-allowed; }
  button.primary { width:100%; font-size:16px; padding:13px 16px; }
  button.sec { background:#fff; color:var(--ink-2); border-color:var(--line); }
  button.sec:hover:not(:disabled) { background:#f6f8fa; filter:none; }
  button.danger { background:#fff; color:var(--warn); border-color:#efc6c6; }
  button.danger:hover:not(:disabled) { background:var(--warn-soft); filter:none; }
  button.small { font-size:13px; padding:6px 12px; }
  .ctrl { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
  .note { color:var(--mute); font-size:12.5px; margin:10px 0 0; line-height:1.55; }

  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:13px; font-weight:700;
          background:#eef1f5; color:var(--ink-2); }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.75; }
  .pill.running, .pill.saving { background:var(--accent-soft); color:var(--accent); }
  .pill.done { background:var(--ok-soft); color:var(--ok); }
  .pill.error { background:var(--warn-soft); color:var(--warn); }
  .pill.aborted { background:var(--amber-soft); color:var(--amber); }
  #paused { font-size:12.5px; color:var(--amber); font-weight:600; }

  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi { border:1px solid var(--line-2); background:#fafbfc; border-radius:10px; padding:10px 12px; min-width:0; }
  .kpi span { display:block; font-size:12px; color:var(--mute); font-weight:600; }
  .kpi b { display:block; font-size:16px; font-weight:700; margin-top:2px; overflow-wrap:anywhere; }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:9px 0; font-size:14px; border-bottom:1px solid var(--line-2); }
  .kv:last-child { border-bottom:0; }
  .kv > span { color:var(--mute); font-weight:500; flex:none; }
  .kv b { font-weight:600; text-align:right; overflow-wrap:anywhere; }
  .kvs { margin-top:12px; }

  .err { color:var(--warn); background:var(--warn-soft); border:1px solid #f1caca; border-radius:9px; padding:10px 12px;
         font-weight:600; font-size:13.5px; margin-top:12px; word-break:break-all; }
  .final { font-size:15.5px; font-weight:700; padding:12px 14px; border-radius:10px; margin-top:12px; color:#fff; background:#7b8696; line-height:1.45; }
  .final.blue { background:var(--blue); } .final.red { background:var(--warn); }
  .decision-reasons { margin-top:12px; padding:12px 14px; border-radius:10px; background:var(--amber-soft); border:1px solid #ecd9a8; }
  .decision-reasons.defect, .decision-reasons.error { background:var(--warn-soft); border-color:#f0c9c9; }
  .decision-reasons.ok { background:var(--blue-soft); border-color:#c9d7f5; }
  .decision-reasons strong { display:block; font-size:15px; margin-bottom:4px; }
  .decision-reasons ul { margin:4px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-2); }

  .workstation-link { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding:12px 16px;
    border:1px solid #c9d7f5; border-radius:9px; background:var(--accent-soft); color:var(--accent); font-size:14px; font-weight:700; text-decoration:none; }
  .workstation-link:hover { background:#dbe6ff; }
  .workstation-link:focus-visible, .zone-tag:focus-visible { outline:3px solid #90afff; outline-offset:3px; }
  .camera-wrap { position:relative; }
  .camera { position:relative; background:#0c1524; border-radius:10px; overflow:hidden; aspect-ratio:3 / 1; display:grid; place-items:center; color:#7f8ea6; font-size:13.5px; }
  .camera img { width:100%; height:100%; object-fit:contain; display:block; }
  .zone-layer { position:absolute; pointer-events:none; }
  .zone-hotspots { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .zone-hit { fill:transparent; pointer-events:all; cursor:help; }
  .zone-tag { position:absolute; transform:translate(-50%,-50%); pointer-events:auto; padding:3px 7px; border:1px solid rgba(255,255,255,.85);
    border-radius:5px; box-shadow:0 1px 5px #0005; font-size:clamp(9px,1vw,12px); line-height:1.4; white-space:nowrap; cursor:help; }
  .zone-tag.blue { background:#1f4fd8; } .zone-tag.red { background:#b82929; }
  .zone-tooltip { position:absolute; z-index:4; width:min(270px,calc(100% - 16px)); padding:12px 14px; border-radius:9px; background:#fff;
    color:var(--ink-2); border:1px solid var(--line); box-shadow:0 4px 20px #0c152433; font-size:12.5px; line-height:1.6; pointer-events:none; }
  .zone-tooltip strong { display:block; margin-bottom:4px; color:var(--ink); font-size:13px; }

  .faces { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .face { border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; background:#fff; }
  .face h3 { margin:0 0 8px; font-size:14.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .face img { width:100%; display:block; border-radius:7px; margin-bottom:6px; background:#eef1f5; min-height:44px; }
  .badge { font-size:12px; font-weight:700; padding:3px 9px; border-radius:6px; color:var(--ink-2); background:#eef1f5; white-space:nowrap; }
  .badge.no_anomaly { background:var(--ok-soft); color:var(--ok); }
  .badge.suspect { background:var(--warn-soft); color:var(--warn); }
  .badge.review, .badge.unmeasurable { background:var(--amber-soft); color:var(--amber); }
  .reasons { font-size:13.5px; color:var(--ink-2); margin:0 0 8px; white-space:pre-line; overflow-wrap:anywhere; }
  .measurements { font-size:12px; }
  .check-result { font-size:20px; font-weight:750; line-height:1.45; margin:16px 0 8px; letter-spacing:-.4px; }
  .face.defect { border-color:#f0c9c9; background:#fffafa; }
  .face.defect .check-result { color:var(--warn); }
  .face.ok .check-result { color:var(--blue); }
  .face.review .check-result { color:var(--amber); }
  .check-evidence { margin-top:14px; }
  .check-evidence summary { font-size:12px; color:var(--mute); cursor:pointer; margin-bottom:10px; }

  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th { text-align:left; font-size:12px; font-weight:700; color:var(--mute); background:#f8f9fb; padding:10px 12px;
             border-bottom:1px solid var(--line); white-space:nowrap; }
  td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-2); vertical-align:top; white-space:nowrap; }
  tbody tr:hover td { background:#fafbfd; }
  .history-reason { min-width:240px; white-space:pre-line; color:var(--ink-2); }
  a.link { color:var(--accent); font-weight:600; font-size:13px; text-decoration:none; padding:6px 10px; border:1px solid var(--line); border-radius:8px; }
  a.link:hover { background:var(--accent-soft); }
  @media (max-width:480px) { .field-row { grid-template-columns:1fr; } .kpis { grid-template-columns:1fr 1fr; } .camera { aspect-ratio:auto; min-height:120px; } }
  #taught-path { display:none; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">PAC</div>
      <div>
        <h1>콜드체인 포장 검사 스테이션</h1>
        <p>Automated Packaging Inspection · PAC2026</p>
      </div>
    </div>
    <div class="top-status">
      <span id="state" class="pill">대기</span>
      <span class="chip"><i></i><span id="robotMode">확인 중</span></span>
    </div>
  </div>
</header>

<main>
  <div class="col">
    <section class="card">
      <div class="card-head"><h2>검사 실행</h2><span class="sub">시료 1개 단위</span></div>
      <div class="card-body">
        <div class="field-row">
          <div><label class="field" for="specimen">시료 ID</label><input id="specimen" placeholder="비우면 자동 번호" autocomplete="off"></div>
          <div><label class="field" for="boxType">상자 종류</label>
            <select id="boxType" title="상자 종류(가르친 자세 세트)">
              <option value="white">흰 상자 70×70×90</option>
              <option value="brown">갈색 상자 80×80×45</option>
              <option value="">공통 자세</option>
            </select></div>
        </div>
        <div class="field-row single">
          <div><label class="field" for="session">세션</label><input id="session" placeholder="세션 이름" value="demo"></div>
        </div>
        <button id="start" class="primary">검사 시작</button>
        <div class="ctrl">
          <button id="pause" class="sec">일시정지</button>
          <button id="resume" class="sec">재개</button>
          <button id="abort" class="danger">중단</button>
        </div>
        <a class="workstation-link" href="/hub">통합 워크스테이션 <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>진행 현황</h2><span id="paused"></span></div>
      <div class="card-body">
        <div class="kpis">
          <div class="kpi"><span>현재 단계</span><b id="step">대기</b></div>
          <div class="kpi"><span>시료</span><b id="spec">없음</b></div>
          <div class="kpi"><span>총 소요 시간</span><b id="elapsed">없음</b></div>
          <div class="kpi"><span>재촬영</span><b id="retakes">0 / 1</b></div>
        </div>
        <div class="kvs">
          <div class="kv"><span>상자 회전</span><b id="boxRot">없음</b></div>
          <div class="kv"><span>센서</span><b id="sensor">확인 중</b></div>
        </div>
        <div id="error" class="err" hidden></div>
        <div id="final" class="final" hidden></div>
        <div id="decisionReasons" class="decision-reasons" hidden aria-live="polite">
          <strong id="decisionTitle"></strong><ul id="decisionList"></ul>
        </div>
      </div>
    </section>

  </div>

  <div class="col">
    <section class="card">
      <div class="card-head"><h2>실시간 카메라</h2><button id="liveBtn" type="button" class="small">끄기</button></div>
      <div class="card-body">
        <div class="camera-wrap" id="cameraWrap">
          <div class="camera" id="cameraFrame"><span id="liveHint" hidden>카메라 연결 확인 중…</span><img id="live" alt="실시간 카메라">
            <div class="zone-layer" id="zoneLayer" hidden>
              <svg class="zone-hotspots" id="zoneHotspots" aria-hidden="true"><polygon class="zone-hit" id="zoneHitBlue"/><polygon class="zone-hit" id="zoneHitRed"/></svg>
              <button class="zone-tag blue" id="zoneBlue" type="button" aria-label="파랑 영역 · 정상" aria-describedby="zoneTooltip" hidden>정상</button>
              <button class="zone-tag red" id="zoneRed" type="button" aria-label="빨강 영역 · 확인 필요" aria-describedby="zoneTooltip" hidden>확인 필요</button>
            </div>
          </div>
          <div class="zone-tooltip" id="zoneTooltip" role="tooltip" hidden><strong id="zoneTooltipTitle"></strong><span id="zoneTooltipText"></span></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>포장 검사 결과</h2><span class="sub">누락·결함을 항목별로 확인</span></div>
      <div class="card-body">
        <div class="faces">
          <div class="face" id="checkTape"></div>
          <div class="face" id="checkBottom"></div>
          <div class="face" id="checkCoolant"></div>
        </div>
      </div>
    </section>
  </div>

  <section class="card wide">
    <div class="card-head"><h2>검사 기록</h2><a class="link" href="/api/runs.csv">CSV 내려받기</a></div>
    <div class="scroll">
      <table>
        <thead><tr><th>번호</th><th>시료</th><th>판정</th><th>분류 이유</th><th>구역</th><th>재촬영</th><th>시간</th><th>상태</th></tr></thead>
        <tbody id="hist"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
// Remove the legacy banner from servers started before this UI update.
document.getElementById('taught-path')?.remove();
const $ = id => document.getElementById(id);
const NA = '없음';
const STEP = { home:'홈 위치', pick_approach:'집기 접근', pick:'집기 위치', lift:'들어올리기',
  face_A:'포장 확인 자세', face_B:'테이프·냉매 확인 자세', face_C:'밑면 확인 자세', bin_ok:'파랑 영역으로 이동', bin_human:'빨강 영역으로 이동' };
const VERDICT = { review:'미판정·검토', no_anomaly:'이상 미검출', suspect:'이상 의심', unmeasurable:'측정 불가' };
const BIN = { ok:'파랑 영역', human:'빨강 영역' };
const BIN_COLOR = { ok:'blue', human:'red' };
const STATE = { idle:'대기', running:'실행 중', saving:'기록 저장 중', done:'완료', error:'오류', aborted:'중단됨' };
// PAC_REASON_PRESENTATION_START
// Read-only presentation shared with the camera preview. Never changes a verdict or routing.
globalThis.PacReasons = (() => {
  const labels = {
    rgb_blur:'영상이 흐려 확인 필요', occluded:'상자가 가려져 확인 필요', pose_out_of_range:'검사 자세 이탈',
    lid_gap_rgb:'뚜껑 틈 의심', lwir_local_contrast:'열화상 분포 이상 의심',
    defect_rules_unavailable:'결함 판정 근거 없음', simulated_inspection:'모의 검사 결과',
    rgb_dark:'영상이 어두워 확인 필요', lwir_frozen:'열화상 정지', lwir_saturated:'열화상 포화',
    defect_rules_unvalidated:'검사 기준값 미검증', coolant_absent:'냉매 누락 의심', coolant_uncertain:'냉매 확인 필요',
    coolant_threshold_missing:'냉매 기준값 없음', tape_extra_blobs:'테이프 개수 초과·배경 혼입 확인 필요',
    tape_threshold_missing_count:'테이프 개수 기준값 없음', bottom_open:'아랫면 결함(벌어짐 의심)',
    bottom_box_not_found:'아랫면 상자를 찾지 못해 확인 필요', bottom_threshold_missing:'아랫면 기준값 없음',
    depth_missing:'뎁스 프레임 없음', depth_invalid:'뎁스 무효값', depth_stale:'오래된 뎁스 프레임',
    depth_before_trigger:'촬영 요청 이전 뎁스', depth_clock_mismatch:'뎁스 시계 불일치',
    depth_insufficient_valid_pixels:'뎁스 유효 픽셀 부족', sensor_time_skew:'센서 시각 차 초과',
    sensor_timestamp_missing:'센서 취득 시각 없음', frame_outside_trigger_window:'촬영 요청 범위 밖 프레임',
    sensor_association_unverified:'동일 시료 연결 조건 미확인'
  };
  const arr = x => Array.isArray(x) ? x : [];
  const count = x => Number.isInteger(x) && x >= 0 ? x : null;
  const unique = x => [...new Set(x)];
  function reasonLabel(value) {
    const r = String(value), n = r.match(/^tape_missing_count_([1-9]\d*)$/);
    if (n) return '테이프 ' + n[1] + '개 누락';
    if (Object.prototype.hasOwnProperty.call(labels, r)) return labels[r];
    const missing = r.match(/^tape_missing_(\w+)$/);
    if (missing) return '테이프 누락(' + missing[1] + ')';
    const threshold = r.match(/^tape_threshold_missing_(\w+)$/);
    if (threshold) return '테이프 기준값 없음(' + threshold[1] + ')';
    return '추가 확인: ' + r;
  }
  function describeInspection(i = {}) {
    i = i || {};
    const f = i.features || {}, reasons = arr(i.reasons).filter(r => typeof r === 'string');
    const out = {face:String(i.face || '?'), kind:'review', title:'검사 결과 확인 필요', details:[], rawReasons:reasons};
    if (i.status !== 'ok') {

// Display-only colour regions from VIS pixels. Never supplies robot targets.
const PacZoneDisplay = (() => {
  function hull(points) {
    points.sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
    const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const half=ps=>{const out=[];for(const p of ps){while(out.length>1 && cross(out[out.length-2],out[out.length-1],p)<=0)out.pop();out.push(p)}return out};

  }

      const i=y*w+x,k=i*4,r=data[k]/255,g=data[k+1]/255,b=data[k+2]/255;
      const v=Math.max(r,g,b),d=v-Math.min(r,g,b);if(v<=40/255 || d/v<=90/255)continue;
      let hue=(v===r?(g-b)/d:v===g?(b-r)/d+2:(r-g)/d+4)*60;if(hue<0)hue+=360;
      if(hue<=16 || hue>=330)masks.red[i]=1;if(hue>=200 && hue<=260)masks.blue[i]=1;
    }
    for(const [key,mask] of Object.entries(masks)) {

      for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
        const i=y*w+x;if(mask[i]&&mask[i-1]&&mask[i+1]&&mask[i-w]&&mask[i+w])clean[i]=1;
      }
      for(let i=0;i<clean.length;i++)if(clean[i]&&!seen[i]){
        const queue=[i],points=[];seen[i]=1;let x0=w,y0=h,x1=0,y1=0;
        for(let at=0;at<queue.length;at++){
          const p=queue[at],x=p%w,y=Math.floor(p/w);points.push([x,y]);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);
          for(const q of [x? p-1:-1,x<w-1?p+1:-1,p-w,p+w])if(q>=0&&q<clean.length&&clean[q]&&!seen[q]){seen[q]=1;queue.push(q)}
        }

      }

    }

  }

})();

      if (key in BIN) { BIN[key] = zone.label; BIN_COLOR[key] = zone.color; }
    }
    $('robotMode').textContent = {mock:'모의 로봇 · 실제 이동 없음', hardware:'실제 로봇 모드'}[s.robot_mode] || '연결 정보 없음';
    const st = s.state;
    $('state').textContent = STATE[st] || st;
    $('state').className = 'pill ' + st;
    $('paused').textContent = s.paused ? '일시정지 요청됨' : '';
    $('step').textContent = run ? (st === 'running' ? stepLabel(run.step) : (st === 'idle' ? '대기' : '종료')) : '대기';
    $('spec').textContent = run ? run.specimen_id : NA;
    {  // 깊이로 잰 상자 회전(집기 접근 방향 기준)과 집게 방향 폭. 폭 초과면 빨간 글씨
      const o = run && run.pick && run.pick.plan && run.pick.plan.box_orientation;
      const el = $('boxRot');
      if (!o) { el.textContent = NA; el.style.color = ''; el.title = ''; }
      else {
        el.textContent = (o.rotation_deg > 0 ? '+' : '') + o.rotation_deg + '° · 폭 ' + (o.jaw_span_mm ?? NA) + 'mm' + (o.warning ? ' ⚠' : '');
        el.style.color = o.warning ? 'var(--warn)' : '';
        el.title = o.warning || '집게 닫힘 방향으로 본 상자 폭';
      }
    }
    $('retakes').textContent = (run ? run.retakes_used : 0) + ' / 1';
    $('elapsed').textContent = run ? fmtMs(run.elapsed_ms) : NA;
    const busy = s.busy ?? (st === 'running' || st === 'saving');
    $('start').disabled = busy;
    $('pause').disabled = st !== 'running' || s.paused;
    $('resume').disabled = st !== 'running' || !s.paused;
    $('abort').disabled = st !== 'running';
    const err = $('error');
    err.hidden = !(run && run.error); err.textContent = run && run.error ? '사유: ' + run.error : '';
    const fin = $('final');
    if (run && run.final_verdict) {
      fin.hidden = false; fin.className = 'final ' + (BIN_COLOR[run.bin] || '');
      fin.textContent = (run.bin === 'ok' ? '정상 판정' : '불량·확인 필요') + ' → ' + (BIN[run.bin] || '분류 확인 필요') +
        (run.placed_bin ? ' · 배치 ' + (BIN[run.placed_bin] || run.placed_bin) : ' · 배치 확인 대기');
    } else fin.hidden = true;
    const summary = PacReasons.summarizeRun(run || {});
    $('decisionReasons').hidden = !run || (!run.final_verdict && !run.error && !summary.lines.length);
    $('decisionReasons').className = 'decision-reasons ' + summary.kind;
    $('decisionTitle').textContent = summary.title;
    $('decisionList').replaceChildren(...summary.lines.map(line => {
      const li = document.createElement('li'); li.textContent = line; return li;
    }));
    const ins = run ? run.inspections : [];
    const checkIds = {tape:'checkTape', bottom:'checkBottom', coolant:'checkCoolant'};
    for (const check of PacReasons.describeChecks(ins)) renderCheck($(checkIds[check.key]), check);
    if (st !== lastState) { lastState = st; loadHistory(); }
  } catch (e) { $('state').textContent = '연결 끊김'; $('state').className = 'pill error'; }
}
let lastState = null;
const historyReasons = new Map();
let historyGeneration = 0;

async function loadHistory() {
  const generation = ++historyGeneration;
  try {
    const runs = await (await api('/api/runs?limit=30')).json();
    if (generation !== historyGeneration) return;
    const tb = $('hist'); tb.textContent = '';
    const pending = [];
    for (const r of runs) {
      const tr = document.createElement('tr');
      const cells = [r.id, r.specimen_id, VERDICT[r.final_verdict] || NA, '', (BIN[r.bin] || NA) + ' / 배치 ' + (BIN[r.placed_bin] || '미확인'),
        r.retakes_used, fmtMs(r.elapsed_ms), STATE[r.state] || r.state];
      for (const c of cells) { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }
      const reasonCell = tr.children[3]; reasonCell.className = 'history-reason';
      if (historyReasons.has(r.id)) reasonCell.textContent = historyReasons.get(r.id);
      else { reasonCell.textContent = '근거 불러오는 중…'; pending.push({run:r, cell:reasonCell}); }
      tb.appendChild(tr);
    }
    // Existing read-only detail API provides reasons; no schema or controller changes.
    await Promise.all(Array.from({length:Math.min(3, pending.length)}, async () => {
      while (pending.length && generation === historyGeneration) {
        const {run:r, cell} = pending.shift();
        try {
          const response = await api('/api/runs/' + encodeURIComponent(r.id) + '/inspections');
          if (!response.ok) throw new Error('inspection history unavailable');
          const summary = PacReasons.summarizeRun(r, await response.json());
          const text = summary.lines.join('\n') || '검사 근거 없음';
          historyReasons.set(r.id, text); cell.textContent = text;
        } catch (e) { cell.textContent = '검사 근거 조회 실패'; }
      }
    }));
  } catch (e) {}
}

async function pollSensor() {
  try {
    const h = await (await api('/api/sensor/health')).json();
    const sensors = h.sensors;
    $('sensor').textContent = sensors ? ('RGB ' + (sensors.vis ? '수신' : '미수신') +
      ' · 열화상 ' + (sensors.lwir ? '수신' : '미수신') + ' · 뎁스 ' +
      (sensors.depth ? '수신' : (h.depth_enabled ? '프레임 없음' : '미사용'))) : (h.ok ? '연결됨' : '연결 안 됨');
    if (h.capture_mode === 'simulated') $('sensor').textContent = '모의 입력 · ' + $('sensor').textContent;
    $('sensor').style.color = h.ok ? 'var(--ok)' : 'var(--warn)';
  } catch (e) { $('sensor').textContent = '확인 불가'; }
}

setInterval(poll, 500);
setInterval(pollSensor, 5000);
poll(); pollSensor(); loadHistory(); liveNext();
</script>
</body>
